[package]
name = "leanpdf-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pdfium-render = { path = "../vendor/pdfium-render", default-features = false, features = ["pdfium_latest", "thread_safe"] }
png = "0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
