[package]
name = "leanpdf"
version = "0.1.0"
edition = "2024"

[dependencies]
leanpdf-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
