name: Release

# Publishing a version: push a tag such as v0.1.0.
#   git tag -a v0.1.0 -m "Summary"
#   git push origin v0.1.0
# The workflow tests the code, builds LeanPDF.exe, a zip and the Windows installer, and attaches the installer and the zip to a
# GitHub release whose notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release and attach the files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            native

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Test, build and make the installer
        shell: pwsh
        run: ./tools/publish.ps1 -Version "${{ steps.version.outputs.version }}" -Installer

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          ./tools/release-notes.ps1 -Version $v -OutFile release-notes.md
          gh release create "${{ github.ref_name }}" `
            "dist/LeanPDF-Setup-$v.exe" `
            "dist/LeanPDF-$v-win-x64.zip" `
            --title "LeanPDF $v" `
            --notes-file release-notes.md
